name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Windows icon
        run: >
          python -c "from PIL import Image;
          Image.open('assets/AppIcon.png').save(
          'assets/AppIcon.ico',
          format='ICO',
          sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Check application imports
        run: |
          python -c "import app; from core.watermark import clean_pdf; print('Import test passed')"

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PDF Watermark Cleaner" --icon assets/AppIcon.ico app.py

      - name: Package Windows app
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\PDF Watermark Cleaner.exe" `
            -DestinationPath "PDF-Watermark-Cleaner-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Watermark-Cleaner-Windows
          path: PDF-Watermark-Cleaner-Windows.zip

      - name: Publish Windows asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          echo "Waiting for release $tag to exist..."
          for i in {1..60}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" PDF-Watermark-Cleaner-Windows.zip --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Release $tag was not created in time."
          exit 1
